[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vid-scr"
version = "0.0.1"
authors = [
  { name="ShinChven", email="shinchven@gmail.com" },
]
description = "A CLI tool to capture thumbnails from a video at regular time intervals."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "opencv-python",
    "pillow",
]

[project.urls]
"Homepage" = "https://github.com/ShinChven/video-screenshot-cli"
"Bug Tracker" = "https://github.com/ShinChven/video-screenshot-cli/issues"

[project.scripts]
vid-scr = "vid_scr.cli:main"
